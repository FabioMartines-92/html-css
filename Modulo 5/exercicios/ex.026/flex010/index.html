<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>

    <style>
        div.conteiner {
            display: flex;
            background-color: aqua;
            flex-flow: row nowrap;/* flex-flow e o shorthand para as funcionalidades do flex box, lembrando sempre de seguir os axis */
            height: 100px;
        }

        div.item {
            background-color: aliceblue;
            text-align: center;
            border: 1px solid black;
            flex-basis: 250px; /* Determina o tamanho do item*/
            flex-shrink: 1; /* Determina se o item vai encolher ou nao, por padrao ele encolhe (1) se nao quiser que encolhe use (0) */
            flex-grow: 1; /* Determina se o item vai aumentar ou nao. por padrao ele nao aumenta (0) se quiser que ele aumente use (1)*/
        }
 /*
flex-shrink e flex-grown seria uma boa combinacao para criar item adaptativos e fluidos.
lembrando que e importante usar (flex-flow row nowrap) 
 
 
 */
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item">Exemplo de Bloco A</div>
        <div class="item">Exemplo de Bloco B</div>
        <div class="item">Exemplo de Bloco C</div>
        
    </div>
    
</body>
</html>

<!--
Flexible box e usado para adaptar os conteiners dentro de um conteiner maior (PAI)
assim nao precisando de configuracao extras.


-->
