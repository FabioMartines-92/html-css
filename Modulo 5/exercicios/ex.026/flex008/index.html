<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>

    <style>
        div.conteiner {
            display: flex;
            background-color: lightblue;
            flex-flow: row wrap;/* flex-flow e o shorthand para as funcionalidades do flex box, lembrando sempre de seguir os axis */
            align-content: stretch;
             /*align-content alinhas os itens no eixo vertical. so pode ser usado com flex-flow: wrap */
            height: 400px;
        }

        div.item {
            background-color: antiquewhite;
            padding: 20px;
            text-align: center;
            border: 1px solid black;
        }
        div#i1 {
            align-self: auto; /* auto: copia a configuracao do align-content do pai. 
            
            obs: nesse exemplo sempre que eu mudo a configuracao diferente de stretch o auto nao funciona*/
        }
        div#i2 {
            align-self: flex-end;
        }
        div#i3 {
           align-self: center;
        }
        div#i4 {
            align-self: flex-start;
        }
        div#i5 {
            align-self: center;
        }
        div#i6 {
            
        }
        div#i7 {
            
        }
        /*
        align-self: mais um propriedade para ser usada apenas para os itens, e alinha individualmente cada intem no eixo cross-axis
        */
 
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item" id="i1">Exemplo de Bloco A</div>
        <div class="item" id="i2">Exemplo de Bloco B</div>
        <div class="item" id="i3">Exemplo de Bloco C</div>
        <div class="item" id="i4">Exemplo de Bloco D</div>
        <div class="item" id="i5">Exemplo de Bloco E</div>
        <div class="item" id="i6">Exemplo de Bloco F</div>
        <div class="item" id="i7">Exemplo de Bloco G</div>
    </div>
    
</body>
</html>

<!--
Flexible box e usado para adaptar os conteiners dentro de um conteiner maior (PAI)
assim nao precisando de configuracao extras.


-->
