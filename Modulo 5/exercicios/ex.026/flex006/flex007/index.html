<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>

    <style>
        div.conteiner {
            display: flex;
            background-color: lightblue;
            flex-flow: row wrap;/* flex-flow e o shorthand para as funcionalidades do flex box, lembrando sempre de seguir os axis */
            
            align-content: flex-start; /*align-content alinhas os itens no eixo vertical. so pode ser usado com flex-flow: wrap */
            height: 400px;
        }

        div.item {
            background-color: antiquewhite;
            padding: 40px;
            text-align: center;
            border: 1px solid black;
        }
        div#i1 {
            order: 0;
        }
        div#i2 {
            order: 1;
        }
        div#i3 {
            order: -4;
        }
        div#i4 {
            order: 2;
        }
        div#i5 {
            order: 3;
        }
        div#i6 {
            order: 5;
        }
        div#i7 {
            order: -3;
        }
        div#i8 {
            order: 0;
        }
        div#i9 {
            order: 4;
        }
        div#i10 {
            order: 10;
        }
 /* propriedade de elementos "order:" basicamente altera a order do elementos de acordo com a ordem crescente selecionada.
 lembrando que essa propriedade somente se aplicada aos itens e nao ao pai*/
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item" id="i1">Exemplo de Bloco A</div>
        <div class="item" id="i2">Exemplo de Bloco B</div>
        <div class="item" id="i3">Exemplo de Bloco C</div>
        <div class="item" id="i4">Exemplo de Bloco D</div>
        <div class="item" id="i5">Exemplo de Bloco E</div>
        <div class="item" id="i6">Exemplo de Bloco F</div>
        <div class="item" id="i7">Exemplo de Bloco G</div>
        <div class="item" id="i8">Exemplo de Bloco H</div>
        <div class="item" id="i9">Exemplo de Bloco I</div>
        <div class="item" id="i10">Exemplo de Bloco J</div>
    </div>
    
</body>
</html>

<!--
Flexible box e usado para adaptar os conteiners dentro de um conteiner maior (PAI)
assim nao precisando de configuracao extras.


-->
