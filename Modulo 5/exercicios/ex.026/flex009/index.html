<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>

    <style>
        div.conteiner {
            display: flex;
            background-color: lightblue;
            flex-flow: row nowrap;/* flex-flow e o shorthand para as funcionalidades do flex box, lembrando sempre de seguir os axis */
            align-content: stretch;
             /*align-content alinhas os itens no eixo vertical. so pode ser usado com flex-flow: wrap */
        }

        div.item {
            background-color: antiquewhite;
            padding: 20px;
            text-align: center;
            border: 1px solid black;
         flex-basis: 300px;
          /* Flex basis determina o tamanho do item dentro do conteiner de acordo com o conteudo. Porem, mesmo determinando um tamanho especifico se o conteiner ficar menor o item vai tentar se adaptar ao tamanho. se existir a configuracao wrap, o conteudo vai se quebrar e manter a configuracao flex basis */
        }
        
 
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item" id="i1">A</div>
        <div class="item" id="i2">Exemplo de Bloco B</div>
        <div class="item" id="i3">C</div>
        <div class="item" id="i4">Exemplo de Bloco D</div>
        <div class="item" id="i5">Exemplo de Bloco E</div>
        <div class="item" id="i6">Exemplo de Bloco F</div>
        <div class="item" id="i7">Exemplo de Bloco G</div>
    </div>
    
</body>
</html>

<!--
Flexible box e usado para adaptar os conteiners dentro de um conteiner maior (PAI)
assim nao precisando de configuracao extras.


-->
